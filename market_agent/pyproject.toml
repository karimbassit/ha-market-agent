[project]
name = "home-assistant-market-agent"
version = "1.1.0"
description = "Daily, auditable portfolio dashboard for Home Assistant"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
market-agent = "market_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
