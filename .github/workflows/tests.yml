name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit and release-security tests
        working-directory: market_agent
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
